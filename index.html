<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBEROPS DEFENSE COMMAND - Tactical Cyber Security & Ethical Hacking Academy</title>
  <meta name="description" content="State-of-the-Art Windows Training Application for Cyber Security, Networking, and Ethical Hacking with 3-Phase Learning, Intelligence Analytics, Military Bookshelf, and Live Threat Radar.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>
  <div id="app">
    <!-- Tactical Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">⚡</div>
        <div class="brand-text">
          <h1>CYBEROPS</h1>
          <p>DEFENSE COMMAND</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">TRAINING SUITE</div>
        
        <div class="nav-item active" id="nav-curriculum">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Curriculum & 3-Phases</span>
          <span class="nav-badge">52</span>
        </div>

        <div class="nav-item" id="nav-revision">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Revision Deck</span>
        </div>

        <div class="nav-section-label">DEFENSE REPOSITORIES</div>

        <div class="nav-item" id="nav-bookshelf">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          <span>Knowledge Books</span>
          <span class="nav-badge">15</span>
        </div>

        <div class="nav-item" id="nav-news">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          <span>Live Threat Radar</span>
          <span class="nav-badge alert">LIVE</span>
        </div>

        <div class="nav-section-label">TACTICAL UTILITIES</div>

        <div class="nav-item" id="nav-tools">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          <span>Subnet & Cyber Tools</span>
        </div>

        <div class="nav-item" id="nav-profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Candidate Dossier</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-badge">
          <div class="avatar-shield">🛡️</div>
          <div class="user-meta">
            <div class="user-name" id="sidebar-user-name">Cadet Officer</div>
            <div class="user-rank" id="sidebar-user-rank">Cyber Cadet</div>
          </div>
        </div>

        <button class="btn-sound-toggle" id="btn-global-sound" title="Toggle Tactical Audio">
          🔊
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="app-main">
      <!-- Tactical Topbar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <div class="topbar-breadcrumbs">
            <span style="color: var(--text-dim);">OPS-CENTER //</span>
            <span class="active" id="topbar-active-breadcrumb">TACTICAL CURRICULUM</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- DEFCON Status -->
          <div class="defcon-status-badge">
            <div class="defcon-dot"></div>
            <span>DEFCON 3 // ELEVATED</span>
          </div>

          <!-- Global Search -->
          <div class="search-box-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="global-search-input" class="search-input" placeholder="Search topics, CVE, commands... (Ctrl+K)" />
          </div>
        </div>
      </header>

      <!-- Viewport Mounting Node -->
      <section class="viewport-container" id="main-viewport">
        <!-- Dynamically injected modules -->
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
